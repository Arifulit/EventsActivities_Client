<!DOCTYPE html>
<html>
<head>
    <title>Event Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        .test-button:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Event API Debug Test</h1>
    
    <div class="test-section">
        <h3>Test API Connection</h3>
        <button class="test-button" onclick="testAPI()">Test API Connection</button>
        <div id="api-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Test Event ID</h3>
        <input type="text" id="eventIdInput" placeholder="Enter event ID" style="width: 300px; padding: 8px; margin: 5px;">
        <button class="test-button" onclick="testEventId()">Test Event Details</button>
        <div id="event-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Current Page Info</h3>
        <div id="page-info" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        function showResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${isSuccess ? 'success' : 'error'}">${message}</div>`;
        }

        async function testAPI() {
            try {
                const response = await fetch(`${API_BASE}/events`);
                const data = await response.json();
                showResult('api-result', `✅ API Connected! Found ${data.data?.length || 0} events`, true);
            } catch (error) {
                showResult('api-result', `❌ API Error: ${error.message}`, false);
            }
        }

        async function testEventId() {
            const eventId = document.getElementById('eventIdInput').value.trim();
            
            if (!eventId) {
                showResult('event-result', '❌ Please enter an event ID', false);
                return;
            }

            try {
                showResult('event-result', '🔄 Testing event ID...', true);
                const response = await fetch(`${API_BASE}/events/${eventId}`);
                const data = await response.json();
                
                if (response.ok) {
                    showResult('event-result', `✅ Event Found! Title: ${data.data?.title || 'N/A'}`, true);
                } else {
                    showResult('event-result', `❌ Event Error: ${data.message || 'Not found'}`, false);
                }
            } catch (error) {
                showResult('event-result', `❌ Network Error: ${error.message}`, false);
            }
        }

        // Show current page info
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const currentEventId = urlParams.get('id');
            const currentPage = window.location.pathname;
            
            document.getElementById('page-info').innerHTML = `
                <strong>Current URL:</strong> ${window.location.href}<br>
                <strong>Event ID from URL:</strong> ${currentEventId || 'None'}<br>
                <strong>Current Path:</strong> ${currentPage}
            `;
        });
    </script>
</body>
</html>
